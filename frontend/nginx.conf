# 前端容器的 nginx 站点配置：托管 Vite 产物，找不到的路径回退到 index.html 交给 React Router
# （直接打开或刷新 /login、/register 不会 404）。由 frontend/Dockerfile 复制到 /etc/nginx/conf.d/default.conf。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
