# Baker Chat 后端的项目元数据、依赖与工具配置（ruff / pytest），由 pip 与 CI 共同读取。
[project]
name = "baker-chat-backend"
version = "0.1.0"
description = "终末地 BAKER 会话消息：FastAPI 后端（鉴权、会话、DeepSeek 流式代理）"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D"]
# D415 只认 ASCII 句末标点，中文文档注释以"。"结尾会被误报
ignore = ["D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 内置提示词与世界观必须逐字保留原文，长行不折
"app/characters.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
